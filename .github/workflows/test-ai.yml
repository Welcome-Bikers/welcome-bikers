name: Test Real Bro AI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Real Bro live-test configuration
        id: config
        shell: bash
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OpenRouter secret is not configured; live Real Bro checks are skipped."
          fi
      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.config.outputs.enabled == 'true'
        run: npm ci
      - name: Probe OpenRouter from GitHub (not RF)
        if: steps.config.outputs.enabled == 'true'
        env:
          VITE_OPENROUTER_API_KEY: ${{ env.OPENROUTER_API_KEY }}
        run: node scripts/probe-openrouter.mjs
      - name: Start local CORS proxy
        if: steps.config.outputs.enabled == 'true'
        env:
          PORT: "8787"
        run: |
          nohup node workers/openrouter-proxy/server.mjs > /tmp/or-proxy.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8787/health && break
            sleep 0.25
          done
      - name: Build with proxy URL (key stays on proxy)
        if: steps.config.outputs.enabled == 'true'
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_OPENROUTER_PROXY_URL: http://127.0.0.1:8787
        run: npm run build
      - name: Install Playwright browsers
        if: steps.config.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Unit + mocked assistant suite
        if: steps.config.outputs.enabled == 'true'
        env:
          VITE_OPENROUTER_PROXY_URL: http://127.0.0.1:8787
        run: npx playwright test e2e/assistant-brain.spec.ts e2e/assistant.spec.ts e2e/assistant-ai.spec.ts e2e/assistant-tts.spec.ts e2e/assistant-voice.spec.ts --reporter=list
      - name: Live OpenRouter Real Bro via proxy
        if: steps.config.outputs.enabled == 'true'
        env:
          LIVE_OPENROUTER: "1"
          VITE_OPENROUTER_PROXY_URL: http://127.0.0.1:8787
        run: npx playwright test e2e/assistant-live.spec.ts --reporter=list
      - name: Probe live TTS to STT voice roundtrip
        if: steps.config.outputs.enabled == 'true'
        env:
          VITE_OPENROUTER_API_KEY: ${{ env.OPENROUTER_API_KEY }}
        run: node scripts/probe-tts.mjs
